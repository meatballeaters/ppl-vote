<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PEMIRA UWKS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-center items-center px-4">

    <!-- Kontainer Utama -->
    <div class="max-w-md w-full">
        
        <!-- Identitas Branding -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-2xl mb-4">
                 <div class="w-12 h-12 bg-yellow-400 rounded-xl flex items-center justify-center font-black text-[8px] border-2 border-yellow-600 text-center leading-none">
                    LOGO UWKS
                </div>
            </div>
            <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Administrator Panel</h1>
            <p class="text-slate-400 text-sm font-medium mt-1 uppercase tracking-widest">Sistem Kontrol E-Voting 2026</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-8">
                <form action="#" class="space-y-6">
                    
                    <!-- Input Identifier (NPM/Email) -->
                    <div class="space-y-2">
                        <label for="identifier" class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">
                            Email Universitas
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i class="fa-solid fa-shield-halved text-sm"></i>
                            </span>
                            <input 
                                type="text" 
                                id="identifier" 
                                name="identifier" 
                                placeholder="admin@uwks.ac.id"
                                class="w-full pl-12 pr-4 py-4 rounded-2xl border-2 border-slate-100 focus:border-slate-900 outline-none transition-all placeholder:text-slate-300 text-sm font-bold text-slate-800"
                                required
                            >
                        </div>
                    </div>

                    <!-- Input Password -->
                    <div class="space-y-2">
                        <label for="password" class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">
                            Password
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i class="fa-solid fa-key text-sm"></i>
                            </span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••"
                                class="w-full pl-12 pr-4 py-4 rounded-2xl border-2 border-slate-100 focus:border-slate-900 outline-none transition-all placeholder:text-slate-300 text-sm font-bold text-slate-800"
                                required
                            >
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-2">
                        <button 
                            type="submit" 
                            class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-xl transition-all transform active:scale-[0.97] uppercase tracking-widest text-xs flex items-center justify-center gap-3"
                        >
                            Masuk <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        </button>
                    </div>

                </form>
            </div>

            <!-- Warning Footer -->
            <div class="bg-slate-50 p-6 border-t border-slate-100">
                <p class="text-[9px] text-slate-400 font-bold uppercase text-center leading-loose">
                    Halaman ini khusus untuk panitia dan administrator sistem. <br>
                    Segala bentuk akses ilegal akan dicatat oleh sistem keamanan.
                </p>
            </div>
        </div>

        <!-- Back to Public -->
        <div class="text-center mt-8">
            <a href="../login.html" class="text-slate-500 hover:text-white text-[10px] font-black uppercase tracking-[0.3em] transition-colors">
                 Kembali ke Halaman Mahasiswa
            </a>
        </div>

    </div>

</body>
</html>
