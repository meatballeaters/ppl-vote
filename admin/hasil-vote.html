<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen & Monitoring - PEMIRA UWKS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-800">

    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col sticky top-0 h-screen">
        <div class="p-6 border-b border-slate-800 flex items-center gap-3">
            <img src="../assets/logo-uwks.png" alt="Logo UWKS" class="w-8 h-8 rounded-lg">
            <span class="font-black text-white tracking-tighter uppercase text-sm">Admin Panel</span>
        </div>
        <nav class="flex-grow p-4 space-y-2 mt-4">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl font-semibold text-sm transition-all">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold text-sm transition-all">
                <i class="fa-solid fa-users"></i> Data & Monitoring
            </a>
            <a href="admin_kandidat.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl font-semibold text-sm transition-all">
                <i class="fa-solid fa-user-tie"></i> Manajemen Kandidat
            </a>
            <a href="admin_laporan.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl font-semibold text-sm transition-all">
                <i class="fa-solid fa-file-invoice"></i> Laporan Akhir
            </a>
        </nav>
    </aside>

    <main class="flex-grow flex flex-col">
        <header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">Data & Monitoring</h2>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Pantau suara dan kelola daftar pemilih</p>
            </div>
        </header>

        <div class="p-8 space-y-8">
            <!-- Monitoring Section (Gabungan Nomor 4) -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-tighter flex items-center gap-2">
                        <i class="fa-solid fa-tower-broadcast text-blue-600 animate-pulse"></i> Live Perolehan Suara
                    </h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-2 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="flex justify-between text-[10px] font-black uppercase">
                            <span>Paslon 01</span>
                            <span class="text-blue-600">45%</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full w-[45%]"></div>
                        </div>
                    </div>
                    <div class="space-y-2 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="flex justify-between text-[10px] font-black uppercase">
                            <span>Paslon 02</span>
                            <span class="text-slate-500">30%</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-slate-500 h-full w-[30%]"></div>
                        </div>
                    </div>
                    <div class="space-y-2 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="flex justify-between text-[10px] font-black uppercase">
                            <span>Paslon 03</span>
                            <span class="text-slate-500">25%</span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-slate-400 h-full w-[25%]"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabel Mahasiswa (Nomor 2) -->
            <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div class="relative w-72">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" placeholder="Cari NPM..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-600">
                    </div>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Impor DPT</button>
                </div>
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                            <th class="px-6 py-4">Mahasiswa</th>
                            <th class="px-6 py-4">Waktu</th>
                            <th class="px-6 py-4">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        <tr>
                            <td class="px-6 py-4">
                                <div class="flex flex-col">
                                    <span class="text-xs font-black text-slate-800">MUHAMMAD NAUFAL A.</span>
                                    <span class="text-[9px] font-bold text-slate-400">23120001</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-[10px] font-medium text-slate-500 italic">07 Mei, 09:12</td>
                            <td class="px-6 py-4">
                                <span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded text-[8px] font-black uppercase border border-emerald-100">Sudah Pilih</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
